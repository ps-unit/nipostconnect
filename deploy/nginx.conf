# Nginx config for NiPOST Connect
# Place at: /etc/nginx/sites-available/nipost-connect
# Then: ln -s /etc/nginx/sites-available/nipost-connect /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d connect.nglosa.com

upstream nipost_connect {
    # Sticky sessions for Socket.io
    ip_hash;
    server 127.0.0.1:5000;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name connect.nglosa.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name connect.nglosa.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/connect.nglosa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect.nglosa.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 256;

    # Client max upload (must match server UPLOAD_MAX_SIZE)
    client_max_body_size 15M;

    # ── Static frontend (React build) ─────────────────────────────────────────
    root /var/www/nipost-connect/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache control for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://nipost_connect;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Socket.io (requires WebSocket upgrade) ────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://nipost_connect;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;    # keep WS alive for 24h
        proxy_send_timeout 86400s;
    }

    # ── File uploads (served directly by Node, cached by Nginx) ──────────────
    location /uploads/ {
        proxy_pass         http://nipost_connect;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Block dot-files
    location ~ /\.(?!well-known) {
        deny all;
    }
}
